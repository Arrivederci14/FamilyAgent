[project]
name = "familyagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashvector>=1.0.23",
    "fastapi==0.128.0",
    "grpcio==1.78.0",
    "httpx>=0.28.1",
    "jinja2==3.1.6",
    "langchain==1.2.7",
    "langchain-community==0.4.1",
    "langchain-core==1.2.17",
    "langchain-openai==1.1.7",
    "langchain-text-splitters==1.1.1",
    # langgraph 1.0.10 与 langgraph-prebuilt>=1.0.8 不兼容（后者要 import core 中
    # 尚不存在的 ExecutionInfo），而 langchain 1.2.7 要求 langgraph<1.1.0，故锁定可用组合
    "langgraph==1.0.7",
    "langgraph-prebuilt==1.0.7",
    "openai==2.16.0",
    # config.py 直接 import pydantic_settings 读 .env；它本来会随 langchain-community
    # 一起被装进来，但直接依赖不该依赖传递依赖，这里显式声明
    "pydantic-settings>=2.0",
    "pypdf==6.6.2",
    "python-multipart>=0.0.32",
    "sse-starlette==3.2.0",
    "uvicorn==0.40.0",
]

[project.scripts]
familyagent = "familyagent:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

# 源码目录为项目根下的 familyagent/（非默认的 src 布局）
[tool.uv.build-backend]
module-root = ""
